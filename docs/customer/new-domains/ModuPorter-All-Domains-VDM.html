nenspezifische Tabellenlisten. Verfügbarkeit und Anzeigeberechtigung werden zur Laufzeit geprüft; die Aufnahme bescheinigt keine Kompatibilität.',table:'DDIC Tabelle',raw:'Ergänzende Rohtabelle',tool:'Lokales Python Werkzeug',report:'Optionaler ABAP Bericht',capacity:'Kapazitäten',shift_calendars:'Schichtkalender',formulas_and_defaults:'Formeln und Vorgaben',task_list_relationships:'Arbeitsplanfolgen und Beziehungen',service_packages:'Servicepakete',object_dependencies:'Objektabhängigkeiten',ecm:'Native ECM Bewertung und Kundenumfang',load:'Kundeneigene Zielbeladung',compare:'Abgleich',links:'Durchgezogen = Datenquelle · Gestrichelt = Association · Nur ausgewählte Beziehungen',noResult:'Keine Objekte für diese Auswahl',clear:'Filter zurücksetzen',version:'Technischer Ausgangsstand'}};
let lang='en', selected=null;
const $=id=>document.getElementById(id), esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const nodes=new Map(MODEL.nodes.map(n=>[n.name.toUpperCase(),n]));
const byName=name=>nodes.get(name.toUpperCase());
const text=key=>TEXT[lang][key]||key;
function nodeButton(name,layer,external=false){return `<button class="node" type="button" data-name="${esc(name)}" data-layer="${layer}" aria-label="${esc(name)}${external?' '+text('external'):''}">${esc(name)}</button>`}
function selectObject(name){selected=name; renderDetail(); highlight();drawEdges()}
function list(names){return names.length?'<ul>'+names.map(n=>`<li><button type="button" data-pick="${esc(n)}">${esc(n)}</button></li>`).join('')+'</ul>':`<p>${text('none')}</p>`}
function renderDetail(){
 if(!selected){$('detail').innerHTML=`<h2>${text('choose')}</h2><p>${text('selection')}</p><p class="note">${text('links')}</p>`;return}
 const n=byName(selected), used=MODEL.nodes.filter(v=>v.sources.concat(v.associations.map(a=>a.target)).some(s=>s.toUpperCase()===selected.toUpperCase())).map(v=>v.name);
 if(n){$('detail').innerHTML=`<h2>${esc(n.name)}</h2><p><span class="pill">${(n.product.endsWith('_ecc')||n.product.endsWith('_src'))?'Source':'Target'} · ${text(n.layer)}</span> <span class="pill">${esc(n.module)}</span></p><p>${esc(n.label)}</p><div class="caption">${text('purpose')}</div><p>${esc(n.purpose||n.label)}</p><div class="caption">${text('keys')}</div><p><code>${esc(n.keys.join(', ')||text('none'))}</code></p><div class="caption">${text('sources')}</div>${list(n.sources)}<div class="caption">${text('associations')}</div>${list(n.associations.map(a=>a.target))}<div class="caption">${text('used')}</div>${list(used)}<div class="caption">${text('checks')}</div><p>${n.checks}</p><div class="caption">${text('file')}</div><p><code>${esc(n.file)}</code></p><p class="note">${text('links')}</p>`}
 else{const report=MODEL.helpers.includes(selected),tool=MODEL.tools.includes(selected);$('detail').innerHTML=`<h2>${esc(selected)}</h2><p>${report?text('report'):tool?text('tool'):text('external')}</p><p>${report||tool?text('reportNote'):text('externalNote')}</p><div class="caption">${text('used')}</div>${list(used)}`}
 $('detail').querySelectorAll('[data-pick]').forEach(b=>b.onclick=()=>selectObject(b.dataset.pick));
}
function highlight(){const n=selected?byName(selected):null;const related=new Set(n?n.sources.concat(n.associations.map(a=>a.target)).map(s=>s.toUpperCase()):[]);MODEL.nodes.filter(v=>v.sources.concat(v.associations.map(a=>a.target)).some(s=>s.toUpperCase()===(selected||'').toUpperCase())).forEach(v=>related.add(v.name.toUpperCase()));document.querySelectorAll('.node').forEach(b=>{const nm=b.dataset.name.toUpperCase(),is=selected&&nm===selected.toUpperCase();b.classList.toggle('selected',!!is);b.classList.toggle('related',related.has(nm));b.classList.toggle('dimmed',!!selected&&!is&&!related.has(nm));b.setAttribute('aria-pressed',is?'true':'false')})}
function drawEdges(){document.querySelectorAll('.edges').forEach(e=>e.remove());if(!selected||innerWidth<660)return;document.querySelectorAll('.lanes').forEach(lanes=>{const buttons=Array.from(lanes.querySelectorAll('.node')),bounds=lanes.getBoundingClientRect();let paths='';for(const b of buttons){const n=byName(b.dataset.name);if(!n)continue;for(const r of n.sources.map(s=>({name:s,assoc:false})).concat(n.associations.map(a=>({name:a.target,assoc:true})))){if(n.name.toUpperCase()!==selected.toUpperCase()&&r.name.toUpperCase()!==selected.toUpperCase())continue;const from=buttons.find(x=>x.dataset.name.toUpperCase()===r.name.toUpperCase());if(!from)continue;const a=from.getBoundingClientRect(),z=b.getBoundingClientRect();let x1=a.right-bounds.left,y1=a.top+a.height/2-bounds.top,x2=z.left-bounds.left,y2=z.top+z.height/2-bounds.top;let c=(x1+x2)/2;paths+=`<path class="${r.assoc?'association':''}" d="M ${x1} ${y1} C ${c} ${y1},${c} ${y2},${x2} ${y2}"/>`}}if(paths){const svg=document.createElementNS('http://www.w3.org/2000/svg','svg');svg.classList.add('edges');svg.setAttribute('aria-hidden','true');svg.innerHTML=paths;lanes.append(svg)}})}
function render(){
 document.documentElement.lang=lang; $('title').textContent=text('title');$('subtitle').textContent=text('subtitle');$('status').textContent=text('status');$('search-label').textContent=text('search');$('system-label').textContent=text('system');$('module-label').textContent=text('module');
 $('flow').innerHTML=['source','basic','composite','consumption','load','compare'].map(k=>`<span>${text(k)}</span>`).join('<b aria-hidden="true">→</b>');
 $('legend').innerHTML=['source','basic','composite','consumption'].map(k=>`<span><i class="dot ${k==='source'?'sap':k}"></i>${text(k)}</span>`).join('');
 const moduleValue=$('module').value||'all',sys=$('system').value,query=$('search').value.toLowerCase();const mods=[...new Set(MODEL.modules.map(m=>m.name))].sort();$('module').innerHTML=`<option value="all">${text('all')}</option>`+mods.map(m=>`<option value="${m}">${m}</option>`).join('');$('module').value=moduleValue;
 const visible=MODEL.nodes.filter(n=>(sys==='all'||(n.product.endsWith('_'+sys)||(sys==='ecc'&&n.product.endsWith('_src'))))&&(moduleValue==='all'||n.module===moduleValue)&&($('domain').value==='all'||n.domain===$('domain').value)&&(!query||[n.name,n.label,n.module,...n.sources].join(' ').toLowerCase().includes(query)));
 $('result').textContent=`${visible.length} / ${MODEL.nodes.length} ${text('shown')}`;let html='';
 for(const spec of MODEL.products){const product=spec.name;const current=visible.filter(n=>n.product===product);if(!current.length)continue;html+=`<section class="product"><div class="product-title"><h2>${esc(spec.title)} · ${text((product.endsWith('_ecc')||product.endsWith('_src'))?'ecc':'s4')}</h2><span>${current.length} ${text('views')} · ${esc(spec.prefix)} / ${esc(spec.package)}</span></div>`;const modules=MODEL.modules.filter(m=>m.product===product).sort((a,b)=>a.batch-b.batch||a.name.localeCompare(b.name));
  for(const mod of modules){const own=current.filter(n=>n.module===mod.name);if(!own.length)continue;const external=[...new Set(own.flatMap(n=>n.sources.concat(n.associations.map(a=>a.target))).filter(r=>!byName(r)))].sort();html+=`<section class="band"><div class="band-title"><h3>${esc(mod.name)} · ${esc(mod.title)}</h3><small>${text('dependency')}: ${esc(mod.dependencies.join(', ')||text('none'))}</small></div><div class="lanes">`;
  for(const layer of ['source','basic','composite','consumption']){const cells=layer==='source'?external:own.filter(n=>n.layer===layer).map(n=>n.name);html+=`<div class="lane"><div class="lane-title"><i class="dot ${layer==='source'?'sap':layer}"></i>${text(layer)}</div>${cells.length?cells.map(n=>nodeButton(n,layer,layer==='source')).join(''):`<div class="empty">${text('no')}</div>`}</div>`} html+='</div></section>'}
  html+='</section>'}
 $('diagram').innerHTML=html||`<p>${text('noResult')}</p>`;$('diagram').querySelectorAll('.node').forEach(b=>b.onclick=()=>selectObject(b.dataset.name));
 $('additional').innerHTML=`<h2>${text('supplement')}</h2><p>${text('supplementNote')}</p>`+MODEL.extensions.map(g=>`<div class="extension"><h3>${text(g.name)}</h3><div class="chips">${g.tables.map(n=>`<button type="button" data-pick="${n}">${n}</button>`).join('')}</div></div>`).join('')+`<h2 style="margin-top:28px">${text('helpers')}</h2><p>${text('reportNote')}</p><div class="chips">${MODEL.helpers.concat(MODEL.tools).map(n=>`<button type="button" data-pick="${n}">${n}</button>`).join('')}</div><details style="margin-top:24px"><summary>${text('allow')}</summary><p>${text('allowNote')}</p><div class="chips">${MODEL.allowlist.map(n=>`<button type="button" data-pick="${n}">${n}</button>`).join('')}</div></details>`;
 $('additional').querySelectorAll('[data-pick]').forEach(b=>b.onclick=()=>{selectObject(b.dataset.pick);$('detail').scrollIntoView({block:'nearest'})});
 $('footer').textContent=`ModuPorter · KAOURI INNOVATECH · ${text('version')}: ${MODEL.revision} · ${MODEL.structures.length} ${lang==='de'?'Extraktionsstrukturen':'extraction structures'} · ${MODEL.structures.reduce((sum,s)=>sum+s.fields,0)} ${lang==='de'?'zugeordnete Felder':'mapped fields'}`;
 renderDetail();highlight();requestAnimationFrame(drawEdges);
}
$('domain').onchange=render;$('language').onchange=()=>{lang=$('language').value;render()};$('search').oninput=render;$('system').onchange=render;$('module').onchange=render;new ResizeObserver(()=>requestAnimationFrame(drawEdges)).observe($('diagram'));render();
</script></body></html>
